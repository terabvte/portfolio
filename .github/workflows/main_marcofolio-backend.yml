# Docs for Azure Web App deploy via OIDC + Azure CLI:
# https://learn.microsoft.com/en-us/azure/app-service/deploy-github-actions

name: Build and deploy ASP.Net Core app to Azure Web App - marcofolio-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Package artifact
        run: cd ./publish && zip -r ../app.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1B4BE346E2D240989C641FFC52F997D5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ACC5A2BFCD3C44C7AABE2B585B3C9D1A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_85B21DDF90724B789B99001A24667AE3 }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group PortfolioBackendRG \
            --name marcofolio-backend \
            --src-path app.zip \
            --type zip \
            --clean true
